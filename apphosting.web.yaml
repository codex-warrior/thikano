# App Hosting overrides for the web backend (environment name: web); see apphosting.yaml.
# The root package.json build/start scripts pick the app from THIKANO_APP (custom App Hosting
# build/run commands rewrite package.json and lose the npm workspaces).
env:
  - variable: THIKANO_APP
    value: web
    availability: [BUILD, RUNTIME]
  # Legal pages (apps/web/src/lib/legal.ts) — fill before launch; DRAFT banner shows until then.
  - variable: NEXT_PUBLIC_LEGAL_ENTITY
    value: "[Registered company name]"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_LEGAL_ADDRESS
    value: "[Registered office address]"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPPORT_EMAIL
    value: "[support@habistat.com]"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPPORT_PHONE
    value: "[Support phone]"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GRIEVANCE_OFFICER
    value: "[Grievance Officer name]"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GRIEVANCE_EMAIL
    value: "[grievance@habistat.com]"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_LEGAL_EFFECTIVE_DATE
    value: "[Effective date]"
    availability: [BUILD, RUNTIME]
