name: CI

on:
  push:
    branches: [master, main, 'thikano-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests · typecheck · builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web-apps
        env:
          THIKANO_ENV: ci

  emulators:
    name: Rules · journeys · browser e2e (Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools@15
      - name: Security rules + end-to-end journeys
        run: npm run test:firebase
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Browser journeys
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
