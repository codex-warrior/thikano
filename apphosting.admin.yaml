# App Hosting overrides for the admin backend (environment name: admin); see apphosting.yaml.
# The root package.json build/start scripts pick the app from THIKANO_APP (custom App Hosting
# build/run commands rewrite package.json and lose the npm workspaces).
env:
  - variable: THIKANO_APP
    value: admin
    availability: [BUILD, RUNTIME]
  # Monorepo mode for App Hosting's Next.js adapter: run the root build, then read the
  # standalone output from apps/admin/.next/standalone/apps/admin.
  - variable: MONOREPO_COMMAND
    value: npm
    availability: [BUILD]
  - variable: GOOGLE_BUILDABLE
    value: apps/admin
    availability: [BUILD]
