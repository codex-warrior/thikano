# Firebase App Hosting backend for apps/owner (root directory: apps/owner).
# Region: asia-southeast1 (Singapore) — App Hosting does not offer asia-south1; functions stay in Mumbai.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  - variable: THIKANO_ENV
    value: production
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: thikano-prod
    availability: [BUILD, RUNTIME]
  - variable: GCLOUD_PROJECT
    value: thikano-prod
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA2PoJZK57ZtoUM9nD_itUEn1j0nd1ecqU
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: thikano-prod.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: thikano-prod.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:780398725785:web:8d1d604624fb75d588c608
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_PUBLIC_WEB_URL
    value: https://thikano.in
    availability: [BUILD, RUNTIME]
